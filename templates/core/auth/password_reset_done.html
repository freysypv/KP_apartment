{% extends "base.html" %}

{% block title %}Check Your Email | KP Apartments{% endblock %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg text-center">
          <div class="card-body p-4 p-md-5">
            <i class="bi bi-envelope-check fs-1 text-warning"></i>
            <h1 class="h3 fw-bold mt-3">Check Your Email</h1>
            <p class="text-muted">
              If an account exists for that email, we've sent instructions to reset your password.
              It may take a few minutes to arrive.
            </p>
            <a href="{% url 'core:login' %}" class="btn btn-dark px-4">Back to Log In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
