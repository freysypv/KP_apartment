{% extends "base.html" %}

{% block title %}Password Updated | KP Apartments{% endblock %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg text-center">
          <div class="card-body p-4 p-md-5">
            <i class="bi bi-check-circle fs-1 text-success"></i>
            <h1 class="h3 fw-bold mt-3">Password Updated</h1>
            <p class="text-muted">Your password has been changed. You can now log in.</p>
            <a href="{% url 'core:login' %}" class="btn btn-dark px-4">Log In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
